version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - node setup-env.js
        - cut -d '=' -f 1 .env
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      # - .next/cache/**/*
